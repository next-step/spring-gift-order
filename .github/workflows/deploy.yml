name: Deploy to EC2

on:
  push:
    branches:
      - happygogildong

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ./build/libs/*.jar
          target: /home/ubuntu/

      - name: Deploy and restart service on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "APP_JWT_SECRET_KEY=${{ secrets.APP_JWT_SECRET_KEY }}" > /tmp/spring-gift-order.env
            echo "CUSTOM_KAKAO_CLIENT_ID=${{ secrets.CUSTOM_KAKAO_CLIENT_ID }}" >> /tmp/spring-gift-order.env
            echo "CUSTOM_KAKAO_REDIRECT=${{ secrets.CUSTOM_KAKAO_REDIRECT }}" >> /tmp/spring-gift-order.env
            echo "CUSTOM_KAKAO_USER_INFO=${{ secrets.CUSTOM_KAKAO_USER_INFO }}" >> /tmp/spring-gift-order.env
            echo "CUSTOM_KAKAO_SENDTO_MYSELF=${{ secrets.CUSTOM_KAKAO_SENDTO_MYSELF }}" >> /tmp/spring-gift-order.env
            echo "CUSTOM_KAKAO_AUTH_SERVER=${{ secrets.CUSTOM_KAKAO_AUTH_SERVER }}" >> /tmp/spring-gift-order.env

            sudo mkdir -p /etc/spring-gift-order
            sudo mv /tmp/spring-gift-order.env /etc/spring-gift-order/spring-gift-order.env
            sudo chown root:root /etc/spring-gift-order/spring-gift-order.env
            sudo chmod 600 /etc/spring-gift-order/spring-gift-order.env
            
            sudo mv /home/ubuntu/build/libs/spring-gift-*.jar /home/ubuntu/build/libs/spring-gift-order.jar

            sudo systemctl daemon-reload
            sudo systemctl restart spring-gift-order

      - name: Verify JAR file
        run: |
          ls -la build/libs/
          jar tf build/libs/*.jar | grep -i manifest
          jar xf build/libs/*.jar META-INF/MANIFEST.MF
          cat META-INF/MANIFEST.MF