name: Deploy To EC2

on:
  push:
    branches:
      - step3

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        env:
          APPLICATION_PROPERTIES: ${{ secrets.APPLICATION_PROPERTIES }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: APPLICATION_PROPERTIES
          script_stop: true
          script: |
            cd /home/ubuntu/repositories/spring-gift-order
            rm -rf src/main/resources/application.properties
            git pull origin step3
            echo "$APPLICATION_PROPERTIES" > src/main/resources/application.properties
            ./gradlew clean build -x test
            sudo fuser -k -n tcp 8080 || true
            java -jar build/libs/*SNAPSHOT.jar > ./output.log 2>&1 &
