verson: '3.8'
services:
  volumes:
    db_data:
  db:
    image: mysql:latest
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: test_gift
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "13306:13306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/main/resources/sql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - ./src/main/resources/sql/init-dataset.sql:/docker-entrypoint-initdb.d/init-dataset.sql
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVER_PORT=8080
      - DB_HOST=db
      - DB_PORT=13306
      - DB_NAME=test_gift
      - DB_USER=test_user
      - DB_PASSWORD=test_password
    ports:
      - "8080:8080"
    depends_on:
      - db

