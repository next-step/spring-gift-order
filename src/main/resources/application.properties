spring.application.name=spring-gift
spring.config.import= optional:file:.env[.properties],optional:file:.env.local[.properties]

server.port=8080

# Database configuration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=60000

# SQL initialization
spring.h2.console.enabled=false
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/init-db.sql

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# error handling
server.error.path=/error

# jwt
gift.jwt.secret=${JWT_SECRET}
gift.jwt.expiration=${JWT_EXPIRATION::3600}
gift.jwt.issuer=spring-gift

gift.base-url=${SERVER_URL}

# OAuth2 configuration
gift.oauth.redirect-uri=${SERVER_URL}/api/auth/oauth2
gift.oauth.provider.kakao.baseurl=https://kauth.kakao.com
gift.oauth.provider.kakao.rest-api-key=${KAKAO_OAUTH_KEY}

# service
gift.service.kakao.message.url=https://kapi.kakao.com/v2/api/talk/memo/send

## cache
spring.cache.type=caffeine

gift.cors.allowed-origins=${SERVER_URL}