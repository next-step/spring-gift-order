spring.application.name=spring-gift
spring.config.import= optional:file:.env[.properties],optional:file:.env.local[.properties]

server.port=${SERVER_PORT::8080}

# Database configuration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# error handling
server.error.path=/error

# jwt
gift.jwt.secret=${JWT_SECRET}
gift.jwt.expiration=${JWT_EXPIRATION::3600}
gift.jwt.issuer=spring-gift

# OAuth2 configuration
gift.oauth.redirect-uri=http://localhost:${SERVER_PORT}/api/auth/oauth2
gift.oauth.provider.kakao.baseurl=https://kauth.kakao.com
gift.oauth.provider.kakao.rest-api-key=${KAKAO_OAUTH_KEY}

# service
gift.service.kakao.message.url=https://kapi.kakao.com/v2/api/talk/memo/send

## cache
spring.cache.type=caffeine
