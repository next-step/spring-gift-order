spring.config.import=optional:file:.env[.properties]
spring.jpa.defer-datasource-initialization=true


spring.application.name=spring-gift
spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:mem:test;MODE=MYSQL;DB_CLOSE_DELAY=-1
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=embedded
spring.jwt.secret=${JWT_KEY}

oauth2.key.kakao=${KAKAO_KEY}
oauth2.redirect.kakao=http://localhost:8080/login/oauth/kakao
kakao.domain.kauth=https://kauth.kakao.com
kakao.domain.kapi=https://kapi.kakao.com

logging.level.org.hibernate.sql=debug

# batchSize
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ??? ??? ??? ??
spring.front.domain=http://localhost:3000

# ??? ?? ??
spring.cookie.sameSite=Lax
spring.cookie.secure=false
spring.cookie.domain=localhost