spring.application.name=spring-gift

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:test
spring.sql.init.mode=always

spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

jwt.secret=Yn2kjibddFAWtnPJ2AFlL8WXmohJMCvigQggaEypa5E=
jwt.token-validity=1800000

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

kakao.rest-api-key = your_key_here

kakao.redirect-uri = http://localhost:8080/oauth/kakao
kakao.token-uri = https://kauth.kakao.com/oauth/token
kakao.profile-uri = https://kapi.kakao.com/v2/user/me
kakao.send-message-uri = https://kapi.kakao.com/v2/api/talk/memo/default/send

spring.jpa.open-in-view=false
server.forward-headers-strategy=FRAMEWORK