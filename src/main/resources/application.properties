spring.application.name=spring-gift
spring.messages.encoding=UTF-8

# H2 DB
spring.datasource.url=jdbc:h2:mem:productdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL reset
spring.sql.init.mode=always

# JPA
spring.jpa.hibernate.ddl-auto=create

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.config.import=optional:classpath:secrets.properties

kakao.client-id=${kakao.api.key}
kakao.redirect-uri=http://52.78.141.79:8080/auth/kakao/callback
kakao.auth-url=https://kauth.kakao.com/oauth/authorize
kakao.token-url=/oauth/token
kakao.user-info-url=/v2/user/me
kakao.message-url=/v2/api/talk/memo/default/send

order.message-template=\u2705 \uC8FC\uBB38\uC774 \uC644\uB8CC\uB418\uC5C8\uC2B5\uB2C8\uB2E4!%n%n- \uC0C1\uD488\uBA85: %s%n- \uC635\uC158: %s%n- \uC218\uB7C9: %d%n- \uBA54\uC2DC\uC9C0: %s%n- \uC8FC\uBB38\uC77C\uC2DC: %s

server.address=0.0.0.0
server.port=8080
