spring.profiles.include=secret

spring.application.name=spring-gift

spring.mvc.hiddenmethod.filter.enabled=true

spring.h2.console.enabled=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

kakao.api.token-uri=https://kauth.kakao.com/oauth/token
kakao.api.user-info-uri=https://kapi.kakao.com/v2/user/me
kakao.api.message-uri=https://kapi.kakao.com/v2/api/talk/memo/default/send