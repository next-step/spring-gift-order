spring:
    thymeleaf:
        cache: true
        prefix: file:src/main/resources/templates/
        suffix: .html
        mode: HTML
        encoding: UTF-8
    datasource:
        url: jdbc:h2:mem:test;MODE=MYSQL;DB_CLOSE_DELAY=-1
    h2:
        console:
            path: /h2-console
            enabled: true
    jpa:
        hibernate:
            ddl-auto: create-drop
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQLDialect
        show-sql: true

