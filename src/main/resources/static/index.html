<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카카오 주문 테스트</title>
</head>
<body>
<h1>✅ 카카오 메시지 주문 테스트 페이지</h1>

<button onclick="sendOrder()">🛒 주문하기</button>

<script>
    // 로그인 후 받은 응답
    const jwtToken = "jwt token 넣기";
    const kakaoAccessToken = "access token 넣기";

    // 쿠키에 kakaoAccessToken 저장
    document.cookie = `kakaoAccessToken=${kakaoAccessToken}; path=/`;

    function sendOrder() {
        fetch("/api/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${jwtToken}`
            },
            credentials: 'include',
            body: JSON.stringify({
                optionId: 1,
                quantity: 2,
                message: "테스트 주문 완료!"
            })
        })
            .then(response => {
                if (!response.ok) throw new Error("주문 실패");
                return response.json();
            })
            .then(data => {
                console.log("✅ 주문 성공:", data);
                alert("주문 성공! 메시지도 확인해보세요.");
            })
            .catch(error => {
                console.error("❌ 주문 실패:", error);
                alert("토큰이 유효하지 않거나 메시지 전송 실패!");
            });
    }
</script>
</body>
</html>
