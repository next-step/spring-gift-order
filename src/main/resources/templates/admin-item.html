<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Item admin page</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
</head>
<body>
<div>
  <h1>상품 관리자 페이지</h1>
  <div>
    <a href="/admin/items/new">새 상품 추가</a>

    <form method="get" action="/admin/items">
      <input type="hidden" name="page" th:value="${page != null ? page.pageNumber : 1}"/>
      <input type="hidden" name="size" th:value="${page != null ? page.pageSize : 10}"/>
      <label>정렬 기준:
        <select name="sortBy">
          <option value="id" th:selected="${sortBy == 'id'}">ID</option>
          <option value="name" th:selected="${sortBy == 'name'}">상품명</option>
          <option value="price" th:selected="${sortBy == 'price'}">가격</option>
        </select>
      </label>
      <label>정렬 방향:
        <select name="direction">
          <option value="asc" th:selected="${direction == 'asc'}">오름차순</option>
          <option value="desc" th:selected="${direction == 'desc'}">내림차순</option>
        </select>
      </label>
      <button type="submit">정렬</button>
    </form>

    <h2>상품 목록</h2>
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>상품명</th>
        <th>가격</th>
        <th>이미지 URL</th>
        <th>수정</th>
        <th>삭제</th>
      </tr>
      </thead>
      <tbody th:if="${items != null and !items.isEmpty()}">
      <tr th:each="item : ${items}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.price} + '원'"></td>
        <td th:text="${item.imageUrl}"></td>
        <td>
          <a th:href="@{/admin/items/update/{id}(id=${item.id})}">수정</a>
        </td>
        <td>
          <form th:action="@{/admin/items/{id}(id=${item.id})}"
                method="post">
            <input type="hidden" name="_method" value="DELETE"/>
            <button type="submit">삭제</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>

    <div th:if="${page != null}">
                <span th:if="${page.pageNumber > 1}">
                    <a
                        th:href="@{/admin/items(page=${page.pageNumber - 1}, size=${page.pageSize}, sortBy=${sortBy}, direction=${direction})}">이전</a>
                </span>
      <span>페이지 [[${page.pageNumber}]] / [[${page.totalPages}]]</span>
      <span th:if="${page.pageNumber < page.totalPages}">
                    <a
                        th:href="@{/admin/items(page=${page.pageNumber + 1}, size=${page.pageSize}, sortBy=${sortBy}, direction=${direction})}">다음</a>
                </span>
      <br/>
      <span>총 [[${page.totalElements}]]개 항목</span>
    </div>
  </div>
</div>
</body>
</html>
