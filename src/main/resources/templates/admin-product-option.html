<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>옵션 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $.ajaxSetup({ xhrFields: { withCredentials: true } });

        $(document).ready(function () {
            const pathParts = window.location.pathname.split('/');
            const productId = pathParts[pathParts.indexOf('products') + 1];

            function renderOptions(options) {
                $('#optionsContainer').empty();
                options.forEach(opt => {
                    const html = `
            <div class="row g-2 optionRow align-items-center mb-2" data-id="${opt.id}">
              <div class="col-md-5">
                <input type="text" class="form-control form-control-sm" value="${opt.name}" disabled>
              </div>
              <div class="col-md-3">
                <input type="number" class="form-control form-control-sm" value="${opt.quantity}" disabled>
              </div>
              <div class="col-md-4">
                <div class="d-flex gap-1">
                  <button type="button" class="btn btn-outline-primary btn-sm goEditPageBtn">수정</button>
                  <button type="button" class="btn btn-danger btn-sm deleteOptionBtn">삭제</button>
                </div>
              </div>
            </div>`;
                    $('#optionsContainer').append(html);
                });
            }

            function fetchOptions() {
                $.get(`/api/products/${productId}/options`, function (options) {
                    renderOptions(options || []);
                });
            }

            fetchOptions();

            // 옵션 수량 수정
            $('#optionsContainer').on('click', '.goEditPageBtn', function () {
                const optionId = $(this).closest('.optionRow').data('id');
                window.location.href = `/admin/products/${productId}/options/${optionId}`;
            });

            // 옵션 삭제
            $('#optionsContainer').on('click', '.deleteOptionBtn', function () {
                const $row = $(this).closest('.optionRow');
                const optionId = $row.data('id');

                if (!confirm("정말 삭제하시겠습니까?")) return;

                $.ajax({
                    url: `/api/options/${optionId}`,
                    method: 'DELETE',
                    success: function () {
                        $row.remove();
                    },
                    error: function () {
                        alert("삭제 실패");
                    }
                });
            });

            // 옵션 추가
            $('#addOptionBtn').on('click', function () {
                const html = `
                <div class="row g-2 optionRow mb-2 new">
                    <div class="col-md-6">
                        <input type="text" class="form-control form-control-sm optionName" placeholder="옵션명">
                    </div>
                    <div class="col-md-4">
                        <input type="number" class="form-control form-control-sm optionQuantity" placeholder="수량">
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="button" class="btn btn-secondary btn-sm removeOptionBtn">제거</button>
                    </div>
                </div>`;
                $('#newOptionsContainer').append(html);
            });

            $('#newOptionsContainer').on('click', '.removeOptionBtn', function () {
                $(this).closest('.optionRow').remove();
            });

            // 새 옵션 저장
            $('#addNewOptionsBtn').on('click', function () {
                const options = [];
                $('#newOptionsContainer .optionRow').each(function () {
                    const name = $(this).find('.optionName').val();
                    const quantity = parseInt($(this).find('.optionQuantity').val());
                    if (name && quantity > 0) {
                        options.push({ optionName: name, quantity });
                    }
                });

                if (options.length === 0) {
                    window.location.href='/admin/products';
                    return;
                }

                $.ajax({
                    url: '/api/options',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        productId: productId,
                        options: options
                    }),
                    success: function () {
                        alert("옵션 수정 완료");
                        $('#newOptionsContainer').empty();
                        fetchOptions();
                    },
                    error: function (jqXHR) {
                        let message = "옵션 수정 실패";
                        if (jqXHR.responseJSON) {
                            const errors = [];
                            const fieldErrors = jqXHR.responseJSON.fieldErrors;
                            const objectErrors = jqXHR.responseJSON.objectErrors;
                            const mesg = jqXHR.responseJSON.message;

                            if (fieldErrors) {
                                for (const key in fieldErrors) {
                                    errors.push(fieldErrors[key]);
                                }
                            }

                            if (objectErrors) {
                                for (const err of objectErrors) {
                                    errors.push(err.message);
                                }
                            }

                            if (mesg) {
                                errors.push(mesg)
                            }

                            if (errors.length > 0) {
                                message = errors.join('\n');
                            }
                        }
                        alert(message);
                    }
                });
            });
        });
    </script>
</head>

<body class="bg-light">
<div th:replace="~{fragments/header.html}"></div>
<div class="container mt-5">
    <h2 class="mb-4 text-primary">옵션 관리</h2>

    <!-- 옵션 목록 -->
    <div id="optionsContainer"></div>

    <hr>
    <h5 class="mt-4">새 옵션 추가</h5>
    <div id="newOptionsContainer"></div>
    <button type="button" id="addOptionBtn" class="btn btn-outline-secondary btn-sm mb-3">옵션 추가</button>
    <button type="button" id="addNewOptionsBtn" class="btn btn-success btn-sm mb-4">저장</button>
</div>
</body>
</html>
