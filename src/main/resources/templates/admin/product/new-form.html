<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>상품 등록</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2em;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 1em;
    }

    label {
      display: block;
      margin-bottom: 0.5em;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 0.5em;
      box-sizing: border-box;
    }

    .btn {
      font-size: 1em;
      font-family: inherit;
      line-height: 1.5;
      border: 1px solid transparent;
      vertical-align: middle;

      padding: 0.7em 1.5em;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-secondary {
      background-color: #6c757d;
    }

    .option-group {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
    }

    .btn-delete {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      margin-top: 5px;
      border-radius: 4px;
    }

  </style>
</head>
<body>
<div class="container">
  <h1>상품 등록</h1>

  <form method="post" th:action="@{/admin/products}" th:object="${product}">
    <div class="form-group">
      <label for="name">상품명</label>
      <input id="name" required th:field="*{name}" type="text">
      <div class="error-message" style="color: red; font-size: 0.9em;"
           th:errors="*{name}"
           th:if="${#fields.hasErrors('name')}">
        이름 관련 오류 메시지
      </div>
    </div>
    <div class="form-group">
      <label for="price">가격</label>
      <input id="price" required th:field="*{price}" type="number">
    </div>
    <div class="form-group">
      <label for="imageUrl">이미지 URL</label>
      <input id="imageUrl" required th:field="*{imageUrl}" type="text">
    </div>

    <div id="options-container">
    </div>
    <button class="btn" id="add-option-btn" style="margin-top: 10px; background-color: #28a745;"
            type="button">옵션 추가
    </button>
    <hr style="margin: 20px 0;">

    <button class="btn" type="submit">등록</button>
    <a class="btn btn-secondary" th:href="@{/admin/products}">취소</a>
  </form>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const optionsContainer = document.getElementById('options-container');
    const addOptionBtn = document.getElementById('add-option-btn');
    let optionIndex = 0;

    addOptionBtn.addEventListener('click', function () {
      const optionDiv = document.createElement('div');
      optionDiv.classList.add('form-group', 'option-group');

      optionDiv.innerHTML = `
        <label style="font-weight: bold;">옵션 #${optionIndex + 1}</label>
        <input type="text" name="options[${optionIndex}].name" placeholder="옵션명 (예: 레드)" required>
        <input type="number" name="options[${optionIndex}].quantity" placeholder="수량" required style="margin-top: 5px;">
        <button type="button" class="btn-delete">삭제</button>
      `;

      optionsContainer.appendChild(optionDiv);

      optionDiv.querySelector('.btn-delete').addEventListener('click', function () {
        optionsContainer.removeChild(optionDiv);
      });

      optionIndex++;
    });
  });
</script>
</body>
</html>
