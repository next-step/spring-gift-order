<!-- 전체 페이지 레이아웃 -->
<html th:replace="~{layout/base :: admin_layout('사용자 등록', '사용자 등록', ~{::create_user_content}, ~{}, ~{::scripts})}" lang="ko">
<!-- 사용자 등록 콘텐츠 fragment -->
<div th:fragment="create_user_content">
    <!-- 사용자 등록 폼 -->
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <!-- 에러 메시지 -->
            <div th:if="${errorMessage}" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
                <p th:text="${errorMessage}">에러 메시지</p>
            </div>

            <form class="space-y-6" method="post" th:action="@{/admin/users}">
                <!-- 이메일 -->
                <div>
                    <label for="user-email-input" class="block text-sm font-medium text-gray-700 mb-2">
                        이메일 <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="email"
                        id="user-email-input"
                        name="email"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="이메일을 입력하세요"
                        required
                    />
                </div>
                <!-- 비밀번호 -->
                <div>
                    <label for="user-password-input" class="block text-sm font-medium text-gray-700 mb-2">
                        비밀번호 <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="password"
                        id="user-password-input"
                        name="password"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="비밀번호를 입력하세요"
                        required
                    />
                </div>
                <!-- 인증 방법(Provider) - 이메일로 고정 -->
                <input type="hidden" name="provider" value="email" />
                <!-- 역할(여러 개 선택 가능) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        역할 <span class="text-red-500">*</span>
                    </label>
                    <div class="flex flex-wrap gap-2">
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="roles" value="ROLE_USER" class="form-checkbox text-blue-600"/>
                            <span class="ml-2 text-xs font-semibold px-2.5 py-0.5 rounded bg-gray-100 text-gray-800 border border-gray-300">USER</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="roles" value="ROLE_MD" class="form-checkbox text-blue-600" />
                            <span class="ml-2 text-xs font-semibold px-2.5 py-0.5 rounded bg-gray-100 text-gray-800 border border-gray-300">MD</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="roles" value="ROLE_ADMIN" class="form-checkbox text-blue-600" />
                            <span class="ml-2 text-xs font-semibold px-2.5 py-0.5 rounded bg-gray-100 text-gray-800 border border-gray-300">ADMIN</span>
                        </label>
                    </div>
                </div>
                <!-- 버튼 영역 -->
                <div class="flex justify-end space-x-4 pt-6">
                    <a href="/admin/users"
                       class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        취소
                    </a>
                    <button
                        type="button"
                        onclick="requestCreateUser()"
                        class="px-4 py-2 bg-blue-600 border border-transparent rounded-lg text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
                    >
                        사용자 등록
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- 스크립트 -->
<th:block th:fragment="scripts">
    <script th:src="@{/js/admin/index.js}"></script>
    <script th:src="@{/js/admin/user/user-create.js}"></script>
</th:block>
</html>
