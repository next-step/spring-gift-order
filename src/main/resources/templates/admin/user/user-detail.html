<!-- 전체 페이지 레이아웃 -->
<!DOCTYPE html>
<html th:replace="~{layout/base :: admin_layout('사용자 상세', '사용자 상세', ~{::view_user_content}, ~{}, ~{::scripts})}" lang="ko">
<div th:fragment="view_user_content">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold">사용자 상세 정보</h1>
                <button type="button" id="edit-mode-btn" onclick="toEditMode()"
                        class="read-mode rounded-lg bg-blue-500 px-4 py-2 text-sm font-medium text-white hover:bg-blue-600 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-colors">
                    수정하기
                </button>
                <button type="button" id="read-mode-btn" onclick="toReadMode()" hidden
                        class="edit-mode rounded-lg bg-blue-500 px-4 py-2 text-sm font-medium text-white hover:bg-blue-600 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-colors">
                    수정취소
                </button>
            </div>
            <form class="space-y-6">
                <!-- 사용자 ID (수정 불가) -->
                <div class="border-b border-gray-200 pb-4">
                    <label class="text-sm font-medium text-gray-700">ID</label>
                    <p class="text-xl font-bold text-gray-900 mt-1" th:text="${user.id}">1</p>
                </div>

                <!-- 이메일 (수정 가능) -->
                <div if="${user.email}" class="border-b border-gray-200 pb-4">
                    <label for="user-email-input" class="text-sm font-medium text-gray-700">이메일</label>

                    <p class="read-mode text-xl font-bold text-gray-900 mt-1" th:text="${user.email}">1</p>
                    <input type="email" id="user-email-input" name="email"
                           class="edit-mode w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-xl font-bold text-gray-900 mt-1"
                           th:placeholder="${user.email}" required hidden/>
                </div>
                <!-- 인증 방법 (수정 불가) -->
                <div class="border-b border-gray-200 pb-4">
                    <label class="text-sm font-medium text-gray-700">인증 방법</label>
                    <p class="text-xl font-bold text-blue-600 mt-1" th:text="${user.provider}">email</p>
                </div>

                <!-- 역할 (수정 가능, 체크박스) -->
                <div class="border-b border-gray-200 pb-4">
                    <label class="text-sm font-medium text-gray-700">역할</label>
                    <div class="flex flex-wrap gap-2 mt-1" id="user-roles-container">
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="roles" value="ROLE_USER" class="form-checkbox text-blue-600"
                                   th:checked="${#lists.contains(roles, 'ROLE_USER')}" disabled/>
                            <span class="ml-2 text-xs font-semibold px-2.5 py-0.5 rounded bg-gray-100 text-gray-800 border border-gray-300">USER</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="roles" value="ROLE_MD" class="form-checkbox text-blue-600"
                                   th:checked="${#lists.contains(roles, 'ROLE_MD')}" disabled/>
                            <span class="ml-2 text-xs font-semibold px-2.5 py-0.5 rounded bg-gray-100 text-gray-800 border border-gray-300">MD</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="roles" value="ROLE_ADMIN" class="form-checkbox text-blue-600"
                                   th:checked="${#lists.contains(roles, 'ROLE_ADMIN')}" disabled/>
                            <span class="ml-2 text-xs font-semibold px-2.5 py-0.5 rounded bg-gray-100 text-gray-800 border border-gray-300">ADMIN</span>
                        </label>
                    </div>
                </div>
                <!-- 비밀번호 (새로 입력 가능, 보이지 않음) -->
                <div class="border-b border-gray-200 pb-4 edit-mode" hidden>
                    <label for="user-password-input" class="text-sm font-medium text-gray-700">새 비밀번호 (선택)</label>
                    <input type="password" id="user-password-input" name="password"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent mt-1"
                           placeholder="새 비밀번호를 입력하세요 (변경 시에만 입력)" />
                </div>
                <!-- 생성일 (수정 불가) -->
                <div class="border-b border-gray-200 pb-4">
                    <label class="text-sm font-medium text-gray-700">가입일</label>
                    <p class="text-sm text-gray-600 mt-1" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></p>
                </div>
                <div class="border-b border-gray-200 pb-4">
                    <label class="text-sm font-medium text-gray-700">수정일</label>
                    <p class="text-sm text-gray-600 mt-1" th:text="${#temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm')}"></p>
                </div>
                <!-- 버튼 영역 -->
                <div class="flex justify-center space-x-4 mt-8 pt-6 border-t border-gray-200">
                    <a href="/admin/users"
                       class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        목록으로
                    </a>
                    <button type="button" hidden onclick="requestEditUser(this)"
                            class="edit-mode px-4 py-2 bg-blue-600 border border-transparent rounded-lg text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        수정하기
                    </button>
                    <button type="button" onclick="requestDeleteUser(this)"
                            class="read-mode px-4 py-2 bg-red-600 border border-transparent rounded-lg text-sm font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors">
                        삭제
                    </button>

                    <input id="user-id-input" type="hidden" th:value="${user.id}" name="userId" />
                </div>
            </form>
        </div>
    </div>
</div>
<th:block th:fragment="scripts">
    <script th:src="@{/js/admin/index.js}"></script>
    <script th:src="@{/js/admin/user/user-edit.js}"></script>
    <script th:src="@{/js/admin/user/user-delete.js}"></script>
</th:block>
</html>
