<!-- 전체 페이지 레이아웃 -->
<!DOCTYPE html>
<html th:replace="~{layout/base :: admin_layout('사용자 목록', '사용자 목록', ~{::user_list_content}, ~{}, ~{::script})}" lang="ko">
<!-- 사용자 목록 콘텐츠 fragment -->
<div th:fragment="user_list_content">
    <!-- 사용자 등록 버튼 (필요시 추가) -->
    <div class="flex justify-end mb-6">
        <a href="/admin/users/create"
           class="rounded-lg bg-green-500 px-4 py-2 text-sm font-medium text-white hover:bg-green-600 focus:outline-none focus:ring-4 focus:ring-green-300 transition-colors">
            사용자 등록
        </a>
    </div>

    <!-- 사용자 목록 테이블 -->
    <div class="bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        ID
                    </th>
                    <th class="px-12 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        이메일
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        인증 방법
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        역할
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        관리
                    </th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                <tr th:each="user, stat : ${pageInfo.contents}" class="hover:bg-gray-50">
                    <!-- ID -->
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${user.id}">
                        1
                    </td>

                    <!-- 이메일 -->
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900" th:text="${user.email}">
                            <!-- 이메일 없을 경우 빈칸 -->
                        </div>
                    </td>

                    <!-- 인증 제공자 -->
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-bold text-blue-600" th:text="${user.provider}">
                            인증 방법
                        </div>
                    </td>

                    <!-- 역할 -->
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex flex-wrap gap-1">
                            <span th:each="role : ${user.userRoles}"
                                  class="inline-block bg-gray-100 text-gray-800 text-xs font-semibold px-2.5 py-0.5 rounded mr-1 mb-1 border border-gray-300"
                                  th:text="${role}">
                                역할
                            </span>
                        </div>
                    </td>

                    <!-- 관리 버튼 -->
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <div class="flex space-x-2">
                            <a th:href="@{'/admin/users/' + ${user.id}}"
                               class="text-blue-600 hover:text-blue-900 bg-blue-50 hover:bg-blue-100 px-3 py-1 rounded-md transition-colors">
                                상세 보기
                            </a>
                        </div>
                    </td>
                </tr>
                <!-- 데이터가 없을 때 -->
                <tr th:if="${#lists.isEmpty(pageInfo.contents)}">
                    <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                        <div class="flex flex-col items-center">
                            <svg class="w-12 h-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                            </svg>
                            <p class="text-lg font-medium">등록된 사용자가 없습니다</p>
                            <p class="text-sm">새로운 사용자를 등록해보세요</p>
                            <!-- <a href="/admin/users/create"
                               class="mt-4 inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                                사용자 등록하기
                            </a> -->
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <div class="mt-8">
        <nav th:replace="~{layout/fragments/pagination :: pagination(${pageInfo}, ${pageStart}, ${pageEnd}, ${baseUrl})}"></nav>
    </div>
</div>

<!-- 스크립트 -->
<th:block th:fragment="scripts">
    <script th:src="@{/js/admin/index.js}"></script>
</th:block>
</html>
