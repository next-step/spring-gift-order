<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카카오 로그인</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .kakao-login-btn {
            background-color: #FEE500;
            color: #000000;
            font-weight: bold;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .kakao-login-btn:hover {
            background-color: #fada00;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>카카오 로그인</h2>
    <form th:action="@{/auth/kakao/login}" method="get">
        <button type="submit" class="kakao-login-btn">카카오로 로그인</button>
    </form>
</div>

</body>
</html>
