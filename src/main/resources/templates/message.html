<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 주문 및 메시지 전송</title>
    <style>
        .active {
            font-weight: bold;
            color: blue;
        }
    </style>
</head>
<body>
<h2>상품 주문 및 카카오톡 메시지 전송</h2>

<form id="orderForm" action="/send-message" method="post">
    <table border="1" cellpadding="8">
        <thead>
        <tr>
            <th>선택</th>
            <th>상품명</th>
            <th>이미지</th>
            <th>가격</th>
            <th>옵션</th>
            <th>수량</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product, iStat : ${products}">
            <td>
                <input type="radio" name="selectedProduct" th:value="${iStat.index}" onchange="selectProduct(this)">
            </td>
            <td th:text="${product.name}"></td>
            <td><img th:src="${product.imageUrl}" alt="이미지" width="80"></td>
            <td th:text="${product.price} + '원'"></td>
            <td>
                <select th:id="'optionSelect_' + ${iStat.index}">
                    <option th:each="opt : ${product.options}"
                            th:value="${opt.id}"
                            th:text="|${opt.name} (수량: ${opt.quantity})|">
                    </option>
                </select>
            </td>
            <td>
                <input type="number" th:id="'quantity_' + ${iStat.index}" value="1" min="1">
            </td>
        </tr>
        </tbody>
    </table>

    <div style="margin-top: 20px;">
        <span th:if="${page.hasPrevious()}">
            <a th:href="@{/message(page=${page.number - 1})}">이전</a>
        </span>
        <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
            <a th:href="@{/message(page=${i})}"
               th:text="${i + 1}"
               th:classappend="${i == page.number} ? 'active' : ''">1</a>
        </span>
        <span th:if="${page.hasNext()}">
            <a th:href="@{/message(page=${page.number + 1})}">다음</a>
        </span>
    </div>

    <br>
    <label for="message">전송 메시지:</label><br>
    <textarea name="message" id="message" rows="4" cols="60">주문이 완료되었습니다.</textarea><br><br>

    <!-- 숨겨진 진짜 전송값 -->
    <input type="hidden" name="optionId" id="hiddenOptionId">
    <input type="hidden" name="quantity" id="hiddenQuantity">

    <button type="submit">주문 + 메시지 전송</button>
</form>

<p th:if="${sent}" style="color:green;">✅ 주문 및 메시지 전송 완료!</p>
<p th:if="${error}" style="color:red;">❌ [[${error}]]</p>

<h3>🧡 위시리스트</h3>
<table style="width: 100%; border-collapse: collapse; margin-top: 15px;" border="1" cellpadding="8">
    <thead style="background-color: #f2f2f2;">
    <tr>
        <th style="width: 50%;">상품명</th>
        <th style="width: 50%;">옵션명</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="wish : ${wishlist}">
        <td th:text="${wish.productName}">상품명</td>
        <td th:text="${wish.optionName}">옵션명</td>
    </tr>
    <tr th:if="${#lists.isEmpty(wishlist)}">
        <td colspan="2" style="text-align: center; padding: 10px; color: gray;">
            위시리스트에 등록된 상품이 없습니다.
        </td>
    </tr>
    </tbody>
</table>

<script>
    function selectProduct(radio) {
        const index = radio.value;
        const optionSelect = document.getElementById('optionSelect_' + index);
        const quantityInput = document.getElementById('quantity_' + index);

        const selectedOptionId = optionSelect.value;
        const quantity = quantityInput.value;

        document.getElementById('hiddenOptionId').value = selectedOptionId;
        document.getElementById('hiddenQuantity').value = quantity;

        // 옵션이 바뀔 경우 다시 반영
        optionSelect.onchange = () => {
            document.getElementById('hiddenOptionId').value = optionSelect.value;
        };
        quantityInput.oninput = () => {
            document.getElementById('hiddenQuantity').value = quantityInput.value;
        };
    }
</script>
</body>
</html>
