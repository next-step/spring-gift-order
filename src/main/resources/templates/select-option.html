<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>옵션 선택</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function () {
            const productId = window.location.pathname.split('/')[2];

            function loadProductOptions() {
                $.ajax({
                    url: `/api/products/${productId}`,
                    method: 'GET',
                    success: function (product) {
                        $('#productName').text(product.name);
                        $('#productImage').attr('src', product.imageURL);
                        $('#productPrice').text(product.price.toLocaleString() + "원");

                        const options = product.options || [];

                        if (options.length === 0) {
                            $('#optionSelect').html(`<option disabled selected>옵션 없음</option>`);
                            $('#quantityInput').prop('disabled', true);
                            $('#addBtn').prop('disabled', true);
                            $('#orderBtn').prop('disabled', true);
                        } else {
                            const optionHTML = options.map(opt =>
                                `<option value="${opt.id}" data-id="${opt.id}" data-quantity="${opt.quantity}">
                                    ${opt.name}
                                </option>`).join('');
                            $('#optionSelect').html(optionHTML);
                            $('#quantityInput').val(1);
                        }
                    },
                    error: function () {
                        alert("상품 정보를 불러오는 데 실패했습니다.");
                        window.location.href = "/products";
                    }
                });
            }

            $('#optionSelect').on('change', function () {
                const selected = $(this).find('option:selected');
                const maxQuantity = parseInt(selected.data('quantity'));
                $('#quantityInput').attr('max', maxQuantity);
                if (parseInt($('#quantityInput').val()) > maxQuantity) {
                    $('#quantityInput').val(maxQuantity);
                }
            });

            $('#addBtn').on('click', function () {
                const selected = $('#optionSelect').find('option:selected');
                const optionId = selected.data('id');
                const quantity = parseInt($('#quantityInput').val());

                if (!optionId || !quantity || quantity < 1) {
                    alert("올바른 옵션과 수량을 선택하세요.");
                    return;
                }

                $.ajax({
                    url: '/api/wish-products',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        productId: productId,
                        optionId: optionId,
                        quantity: quantity
                    }),
                    success: function () {
                        alert("위시리스트에 추가되었습니다.");
                        window.location.href = '/products';
                    },
                    error: function (xhr) {
                        let message = "추가 실패";
                        const res = xhr.responseJSON;
                        if (res?.message) {
                            message = res.message;
                        }
                        alert(message);
                    }
                });
            });

            $('#orderBtn').on('click', function () {
                const selected = $('#optionSelect').find('option:selected');
                const optionId = selected.data('id');
                const quantity = parseInt($('#quantityInput').val());

                if (!optionId || !quantity || quantity < 1) {
                    alert("올바른 옵션과 수량을 선택하세요.");
                    return;
                }

                const message = prompt("주문 메시지를 입력하세요:", "");

                if (message === null) return;

                $.ajax({
                    url: '/api/orders/direct',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        optionId: optionId,
                        quantity: quantity,
                        message: message
                    }),
                    success: function () {
                        alert("주문이 완료되었습니다.");
                        window.location.href = "/products";
                    },
                    error: function (jqXHR) {
                        let msg = "주문 실패";
                        if (jqXHR.responseJSON?.message) msg = jqXHR.responseJSON.message;
                        alert(msg);
                    }
                });
            });

            $('#backBtn').on('click', function () {
                window.history.back();
            });

            loadProductOptions();
        });
    </script>
</head>
<body class="bg-light">
<div th:replace="~{fragments/header.html}"></div>
<div class="container mt-5">
    <h2 class="mb-4 text-primary">옵션 선택</h2>

    <div class="card shadow p-4">
        <div class="row align-items-center mb-3">
            <div class="col-md-3 text-center">
                <img id="productImage" src="" class="img-fluid rounded" alt="상품 이미지">
            </div>
            <div class="col-md-9">
                <h4 id="productName" class="fw-bold mb-2">상품명</h4>
                <p id="productPrice" class="text-muted">가격</p>
            </div>
        </div>

        <div class="mb-3">
            <label for="optionSelect" class="form-label">옵션 선택</label>
            <select class="form-select" id="optionSelect"></select>
        </div>

        <div class="mb-3">
            <label for="quantityInput" class="form-label">수량</label>
            <input type="number" class="form-control" id="quantityInput" value="1" min="1">
        </div>

        <div class="d-flex justify-content-between">
            <button id="backBtn" class="btn btn-secondary">이전으로</button>
            <div>
                <button id="orderBtn" class="btn btn-primary me-2">바로 주문</button>
                <button id="addBtn" class="btn btn-success">위시리스트 추가</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
