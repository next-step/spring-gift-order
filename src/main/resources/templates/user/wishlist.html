<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>나의 위시리스트</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 2em;
      background-color: #f8f9fa;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 2em;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }

    h1 {
      color: #343a40;
      border-bottom: 2px solid #dee2e6;
      padding-bottom: 0.5em;
      margin-bottom: 1em;
    }

    .product-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5em;
    }

    .product-table th, .product-table td {
      border: 1px solid #dee2e6;
      padding: 12px;
      text-align: left;
    }

    .product-table th {
      background-color: #f2f2f2;
      font-weight: 600;
    }

    .product-table td.image-cell {
      text-align: center;
    }

    .product-table img {
      max-width: 100px;
      height: auto;
      border-radius: 4px;
    }

    .btn-delete {
      color: #fff;
      background-color: #dc3545;
      border-color: #dc3545;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }

    /* 페이지네이션 UI 스타일 추가 */
    .pagination {
      margin-top: 2em;
      text-align: center;
    }

    .pagination a, .pagination span {
      display: inline-block;
      padding: 8px 16px;
      text-decoration: none;
      color: #007bff;
      border: 1px solid #dee2e6;
      margin: 0 4px;
      border-radius: 4px;
      cursor: pointer;
    }

    .pagination a:hover {
      background-color: #e9ecef;
    }

    .pagination .current {
      background-color: #007bff;
      color: white;
      border-color: #007bff;
      cursor: default;
    }

    .pagination .disabled {
      color: #6c757d;
      pointer-events: none;
      border-color: #dee2e6;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🎁 나의 위시리스트</h1>
  <a style="text-decoration: none;" th:href="@{/}">🏠 홈으로 돌아가기</a>

  <table class="product-table">
    <thead>
    <tr>
      <th>ID</th>
      <th>이름</th>
      <th>가격</th>
      <th>이미지</th>
      <th>관리</th>
    </tr>
    </thead>
    <tbody id="wishlist-container">
    </tbody>
  </table>

  <div class="pagination" id="pagination-container"></div>
</div>

<script>
  const FIRST_PAGE = 0;
  const PAGE_SIZE = 3;

  document.addEventListener('DOMContentLoaded', function () {
    loadWishes(FIRST_PAGE);
  });

  async function loadWishes(page = FIRST_PAGE) {
    const token = localStorage.getItem('auth_token');

    if (!token) {
      alert('로그인이 필요합니다.');
      window.location.href = '/login';
      return;
    }

    const container = document.getElementById('wishlist-container');
    try {
      const response = await fetch(`/api/wishes?page=${page}&size=${PAGE_SIZE}&sort=id,desc`, {
        headers: {
          'Authorization': 'Bearer ' + token,
        },
      });

      if (response.status === 401) {
        alert('세션이 만료되었거나 유효하지 않습니다. 다시 로그인해주세요.');
        localStorage.removeItem('auth_token');
        window.location.href = '/login';
        return;
      }

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const pageData = await response.json();
      const products = pageData.content;
      container.innerHTML = '';
      products.forEach(product => {
        const row = `
          <tr>
            <td>${product.id}</td>
            <td>${product.name}</td>
            <td>${product.price.toLocaleString()}원</td>
            <td class="image-cell"><img src="${product.imageUrl}" alt="${product.name} 이미지"></td>
            <td>
              <button class="btn-delete" onclick="deleteWish(${product.id})">삭제</button>
            </td>
          </tr>
        `;
        container.innerHTML += row;
      });

      renderPagination(pageData);

    } catch (error) {
      console.error('위시리스트를 불러오는 중 오류가 발생했습니다:', error);
      container.innerHTML = '<tr><td colspan="5">위시리스트를 불러오는 데 실패했습니다.</td></tr>';
    }
  }

  function renderPagination(pageData) {
    const paginationContainer = document.getElementById('pagination-container');
    paginationContainer.innerHTML = '';

    if (!pageData.first) {
      paginationContainer.innerHTML += `<a onclick="loadWishes(${pageData.number
      - 1})">&laquo; 이전</a>`;
    }

    for (let i = 0; i < pageData.totalPages; i++) {
      paginationContainer.innerHTML += (i === pageData.number)
          ? `<span class="current">${i + 1}</span>`
          : `<a onclick="loadWishes(${i})">${i + 1}</a>`;
    }

    if (!pageData.last) {
      paginationContainer.innerHTML += `<a onclick="loadWishes(${pageData.number
      + 1})">다음 &raquo;</a>`;
    }
  }

  async function deleteWish(productId) {
    const token = localStorage.getItem('auth_token');
    if (!token) {
      alert('로그인이 필요합니다.');
      window.location.href = '/login';
      return;
    }

    if (!confirm(`정말로 이 상품을 위시리스트에서 삭제하시겠습니까? (ID: ${productId})`)) {
      return;
    }

    try {
      const response = await fetch(`/api/wishes/products/${productId}`, {
        method: 'DELETE',
        headers: {
          'Authorization': 'Bearer ' + token,
        },
      });

      if (response.ok) {
        alert('상품이 위시리스트에서 삭제되었습니다.');
        const currentPage = document.querySelector('.pagination .current');
        const pageNum = currentPage ? parseInt(currentPage.textContent) - 1 : FIRST_PAGE;
        loadWishes(pageNum);
      } else {
        const errorMessage = await response.text();
        throw new Error(errorMessage || `서버 오류! status: ${response.status}`);
      }
    } catch (error) {
      console.error('위시리스트 삭제 중 오류 발생:', error);
      alert(`삭제 중 오류가 발생했습니다: ${error.message}`);
    }
  }
</script>
</body>
</html>
