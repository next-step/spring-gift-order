<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>위시리스트 테스트</title>
</head>
<body>
<h1>위시리스트 테스트</h1>

<label>JWT 토큰:
    <input type="text" id="token" style="width: 400px;">
</label>

<h2>위시리스트 조회</h2>
<button onclick="getWishes()">조회하기</button>
<pre id="wishlist"></pre>

<h2>전체 상품 목록</h2>
<ul id="productList"></ul>
<div id="pagination"></div>

<h2>상품 삭제</h2>
<label>상품 ID:
    <input type="number" id="deleteProductId">
</label>
<button onclick="deleteWish()">삭제</button>

<h2>로그아웃</h2>
<button onclick="logout()">로그아웃</button>

<script>
    const baseUrl = "http://localhost:8080";
    const apiUrl = baseUrl + "/wishes";
    const productUrl = baseUrl + "/api/products";

    window.onload = () => {
        const token = localStorage.getItem("token");
        document.getElementById("token").value = token || "";
        if (!token) {
            alert("로그인이 필요합니다.");
            window.location.href = "/auth";
        }
        getAllProducts(0);
    };

    function getToken() {
        return document.getElementById("token").value;
    }

    function getWishes() {
        fetch(apiUrl, {
            headers: { Authorization: "Bearer " + getToken() }
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById("wishlist").textContent = JSON.stringify(data.content || [], null, 2);
            })
            .catch(err => alert("조회 실패: " + err));
    }

    function addWish(productId) {
        const select = document.getElementById(`option-select-${productId}`);
        if (!select || !select.value) {
            alert("옵션을 선택해주세요.");
            return;
        }

        const optionId = Number(select.value);

        fetch(apiUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + getToken()
            },
            body: JSON.stringify({ productId, optionId })
        })
            .then(() => alert("추가 성공"))
            .catch(err => alert("추가 실패: " + err));
    }

    function deleteWish() {
        const productId = document.getElementById("deleteProductId").value;
        fetch(apiUrl, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + getToken()
            },
            body: JSON.stringify({ productId: Number(productId) })
        })
            .then(() => alert("삭제 성공"))
            .catch(err => alert("삭제 실패: " + err));
    }

    function getAllProducts(page) {
        fetch(`${productUrl}?page=${page}&size=5`)
            .then(res => res.json())
            .then(data => {
                renderProducts(data.content || []);
                renderPagination(data.totalPages, data.number);
            })
            .catch(err => alert("상품 목록 불러오기 실패: " + err));
    }

    function renderProducts(products) {
        const list = document.getElementById("productList");
        list.innerHTML = "";
        products.forEach(product => {
            const li = document.createElement("li");
            li.innerHTML = `
                ${product.id}. ${product.name} (${product.price}원)
                <select id="option-select-${product.id}"><option>옵션 불러오는 중...</option></select>
                <button onclick="addWish(${product.id})">➕ 추가</button>
            `;
            list.appendChild(li);
            loadOptions(product.id);
        });
    }

    function loadOptions(productId) {
        fetch(`${productUrl}/${productId}/options`)
            .then(res => res.json())
            .then(options => {
                const select = document.getElementById(`option-select-${productId}`);
                select.innerHTML = options.map(o =>
                    `<option value="${o.id}">${o.name} (수량: ${o.quantity})</option>`
                ).join('');
            })
            .catch(err => {
                const select = document.getElementById(`option-select-${productId}`);
                select.innerHTML = `<option>옵션 불러오기 실패</option>`;
            });
    }

    function renderPagination(totalPages, currentPage) {
        const pagination = document.getElementById("pagination");
        pagination.innerHTML = "";

        for (let i = 0; i < totalPages; i++) {
            const btn = document.createElement("button");
            btn.textContent = i + 1;
            if (i === currentPage) {
                btn.disabled = true;
                btn.style.fontWeight = "bold";
            }
            btn.onclick = () => getAllProducts(i);
            pagination.appendChild(btn);
        }
    }

    function logout() {
        localStorage.removeItem("token");
        alert("로그아웃되었습니다.");
        window.location.href = "/auth";
    }
</script>

</body>
</html>
